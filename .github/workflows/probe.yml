name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe upstreams
        run: |
          node -e '
          const urls = [
            "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXNFLGAME&status=open&limit=1000",
            "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXNCAAFSPREAD&status=open&limit=1000",
            "https://external-api.kalshi.com/trade-api/v2/markets?series_ticker=KXNFLTOTAL&status=open&limit=1000",
            "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXNFLRSHYDS&status=open&limit=1000",
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",
          ];
          (async () => {
            for (let round = 0; round < 3; round++) {
              for (const u of urls) {
                const t = Date.now();
                const r = await fetch(u, { headers: { accept: "application/json" } });
                const b = await r.text();
                console.log(round, r.status, b.length, Date.now() - t, "ms", u.split("?")[1] || u);
              }
            }
          })();'
