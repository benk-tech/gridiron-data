# Offline tests (node --test, fixtures only, no network). Kept out of collect.yml so a failing test can never stop
# the scheduled collector from posting.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Offline tests
        run: |
          node --version
          node --test test/*.test.mjs
