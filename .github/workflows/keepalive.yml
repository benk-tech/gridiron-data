# GitHub disables scheduled workflows in a public repo after 60 days with no repository activity.
# Once a week, if the newest commit is 25 or more days old, commit a one-line date marker. In season the closes
# archive commits keep the repo active, so this normally fires only in the off-season.
name: keepalive

on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays 09:17 UTC (off the top of the hour, when GitHub drops the most scheduled runs)
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    concurrency:
      group: keepalive
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Commit a marker if the repo is quiet
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "newest commit is ${age_days} days old"
          if [ "$age_days" -lt 25 ]; then exit 0; fi
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          git commit -q -m "chore: keepalive marker"
          for i in 1 2 3; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "keepalive: pushed"
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "::error::keepalive push failed 3 times"
          exit 1
